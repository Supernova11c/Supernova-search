<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin access · Supernova Search</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="page-shell admin-login-shell"><section class="panel admin-login-card"><div class="section-kicker">SUPER NOVA SEARCH · ADMIN</div><h1>Operator access</h1><p>Enter the configured admin token to manage curated URLs and ranking boosts.</p>{% if error %}<div class="notice notice-error">{{ error }}</div>{% endif %}<form method="post" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="token">Admin token</label><input id="token" name="token" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><a class="panel-link" href="{{ url_for('index') }}">Back to search</a></section></main></body></html>
